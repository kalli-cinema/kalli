name: release

# Every push to main whose package.json version has no release yet builds the installers (Windows setup .exe,
# Linux AppImage and .deb) and publishes them as release v<version>, with the latest*.yml manifests that
# installed copies read to update themselves (src/main/updater.ts). To ship: bump `version` and push.
# "Run workflow" on the Actions tab builds the same files without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$(node -p "require('./package.json').version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 = oldest glibc we support, so the AppImage and .deb run on 22.04 and newer.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # fetch-mpv asks GitHub's API for the latest mpv build; anonymous runners hit the rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # scripts/fetch-mpv.ts runs under plain Node, which strips TypeScript types from 22.18 on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Checks
        if: runner.os == 'Linux'
        run: |
          bun run test
          bun run typecheck

      - name: Installers
        shell: bash
        run: |
          node scripts/fetch-mpv.ts
          bun run build
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: kalli-${{ runner.os }}
          # the installers, plus the manifests and blockmaps electron-updater reads
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # File names must stay as electron-builder wrote them: latest*.yml points at them by name.
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Kalli $TAG" --generate-notes
